name: Pages

# Только ручной запуск: Actions → Pages → Run workflow (или `gh workflow run pages.yml --ref <ветка>`).
# Автоматически ничего не запускается — ни при push, ни в пул-реквестах.
# Из любой ветки: тесты и сборка. Из master: ещё и публикация сайта.
on:
  workflow_dispatch:

permissions:
  contents: read

# Свежий запуск отменяет предыдущий для той же ветки, но запуск на master
# не отменяется никогда: иначе второй запуск мог бы сорвать публикацию сайта.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build site
        env:
          # Optional: set repository variable WAHBOOK_API to enable accounts.
          WAHBOOK_API: ${{ vars.WAHBOOK_API }}
        run: |
          # Project pages live under /<repo>/, user pages (<user>.github.io) at the root.
          base="$(echo "${{ steps.pages.outputs.base_path }}")"
          go run ./cmd/site -base "${base:-/}" -out dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Публикация — только при ручном запуске из master. Запуск из другой ветки проходит тесты
  # и сборку, но сайт не публикует (окружение github-pages и так разрешает только master).
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false # начатую публикацию не обрываем
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
