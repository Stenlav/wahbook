name: Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Свежий запуск отменяет предыдущий для той же ветки или пул-реквеста, но запуск на master
# не отменяется никогда: иначе правка в открытом PR могла бы сорвать публикацию сайта.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          # Optional: set repository variable WAHBOOK_API to enable accounts.
          WAHBOOK_API: ${{ vars.WAHBOOK_API }}
        run: |
          # Project pages live under /<repo>/, user pages (<user>.github.io) at the root.
          base="$(echo "${{ steps.pages.outputs.base_path }}")"
          go run ./cmd/site -base "${base:-/}" -out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Публикация — только после слияния в master (push в master). Пул-реквесты и ручные запуски
  # на других ветках проходят тесты и сборку, но сайт не публикуют.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false # начатую публикацию не обрываем
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
