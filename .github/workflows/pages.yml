name: Pages

# Только ручной запуск: Actions → Pages → Run workflow (или `gh workflow run pages.yml --ref <ветка>`).
# Автоматически ничего не запускается — ни при push, ни в пул-реквестах.
# Из любой ветки: тесты, сборка и публикация сайта.
on:
  workflow_dispatch:

permissions:
  contents: read

# Публиковать может любая ветка, поэтому идущий запуск никогда не отменяется:
# иначе второй запуск мог бы оборвать публикацию на середине.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build site
        env:
          # Optional: set repository variable WAHBOOK_API to enable accounts.
          WAHBOOK_API: ${{ vars.WAHBOOK_API }}
        run: |
          # Project pages live under /<repo>/, user pages (<user>.github.io) at the root.
          base="$(echo "${{ steps.pages.outputs.base_path }}")"
          go run ./cmd/site -base "${base:-/}" -out dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Публикация — при любом ручном запуске, из какой бы ветки он ни был. Ветки, которым можно
  # публиковаться, ограничивает окружение github-pages (Settings → Environments → github-pages).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false # начатую публикацию не обрываем
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
