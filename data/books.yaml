# Каталог книг. Единственный источник правды для сайта.
#
# Поля книги:
#   series   — id серии из списка ниже
#   n        — номер внутри серии (необязательно)
#   hh       — сквозной номер в основной нумерации Black Library (необязательно)
#   title    — оригинальное название; из него строится id (slug) и имя файла обложки.
#              Если оригинала нет (книга только на русском), пишется русское название и задаётся id вручную
#   title_ru — русское название (по русской вики; необязательно)
#   author   — автор; "Various" для сборников
#   editors  — составители сборника (необязательно)
#   year     — год первой публикации
#   kind     — novel | novella | anthology (разные авторы) | collection (сборник одного автора) | audio | artbook
#   author   — один автор или несколько через запятую; "Various" — для антологий
#   wiki     — страница русской вики ("Страница#Раздел"): источник сведений для аннотаций, на сайте не показывается
#   fantlab  — id произведения на FantLab, если поиск по названию не находит книгу
#   id       — задать вручную, если автоматический slug не подходит
#
# Порядок книг в файле = порядок на сайте внутри серии.

series:
  - id: heresy
    title: Ересь Хоруса
    title_en: The Horus Heresy
    description: >-
      Основная серия: Хорус Луперкаль, любимый сын Императора, поднимает мятеж, и Империум
      раскалывается надвое.
  - id: siege
    title: Осада Терры
    title_en: The Siege of Terra
    description: >-
      Финал Ереси. Армии Хоруса подходят к Солнечной системе, а Император и верные ему
      примархи принимают последний бой за Терру.
  - id: primarchs
    title: Примархи
    title_en: Primarchs
    description: >-
      Серия биографических романов о примархах — от Робаута Гиллимана до Альфария,
      а также сборники рассказов о них.
  - id: characters
    title: Персонажи
    title_en: Characters
    description: >-
      Отдельные романы о людях и воинах, чьи судьбы сплелись с Ересью, но кто не был примархом.
  - id: scouring
    title: Очищение
    title_en: The Scouring
    description: >-
      Продолжение после Осады Терры: конец гражданской войны, её последствия и события
      Великого Очищения глазами лоялистов, предателей и остального человечества.
  - id: standalone
    title: Вне основного цикла
    title_en: Beyond the Main Cycle
    description: >-
      Книги вне нумерованных серий: сборники и роман, вышедшие уже после завершения основного
      цикла, и иллюстрированные издания.
  - id: novellas
    title: Повести
    title_en: Novellas
    description: >-
      Отдельные повести Ереси Хоруса: многие выходили в электронном виде, а потом вошли в сборники
      и антологии.

