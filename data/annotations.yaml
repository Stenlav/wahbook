# Аннотации к книгам: id книги → текст. Файл создаёт `go run ./cmd/annotations`
# из описаний произведений на FantLab (https://fantlab.ru) дословно; руками его лучше не править,
# иначе правки пропадут при следующем обновлении. Показываются в карточке книги.
horus-rising: То было легендарное время. Великий Крестовый Поход нес свет Имперских Истин в самые темные уголки Галактики, возвращая разрозненные миры человечества в лоно Империума и стирая чуждые расы с лица истории. По воле благословенного Императора, решившего отойти от ратных дел, бразды правления этой беспримерной кампанией были вручены Хорусу, примарху Легиона Лунных Волков. Так говорят летописи, но ни в одной из них не найти ответа на вопрос - когда, под небом какого мира, проросли семена Великой Ереси. Может быть, это случилось в тот день, когда Хорус убил Императора в первый раз…
false-gods: 'Великий Крестовый Поход продолжает свое победоносное шествие по Галактике, экспедиционные корабли бороздят космические просторы, Империум потихоньку обрастает бюрократами и налоговыми инспекторами. А Воитель Хорус, пребывая в зените своего могущества, терзается смутными сомнениями: за каким дьяволом его присутствие снова потребовалось на планете Давин, завоеванной шестьдесят лет назад! Предательство... Это слово впервые прозвучало на Давине и жестоко ранило Хоруса. Но куда более жестоко его ранил отравленный клинок — анафем. Хоруса действительно послали за дьяволом. Причем не одним. На хрупком мосту между жизнью и смертью состоялась его решающая битва с лживыми богами Хаоса. Это был день, когда Хорус пал...'
galaxy-in-flames: Предательство свершилось. Воитель Хорус ступил на путь, который не предполагает возвращения. Он намерен ввергнуть всю Галактику в огонь братоубийственной войны и выковать в этом пламени смертоносный клинок - верные одному лишь ему Легионы Космодесанта. И первой пробой становится зачистка планеты Истваан III, где суждено погибнуть не только древней цивилизации, но и всем, кто остался верен присяге, долгу и человечности.
the-flight-of-the-eisenstein: После того как предательство примарха Хоруса стало очевидно, единственной целью немногих выживших и сохранивших верность присяге и долгу граждан Империума стала Терра. Фрегат «Эйзенштейн» под командованием капитана Гвардии Смерти Натаниэля Гарро прорывается к колыбели человечества, чтобы довести до сведения Императора известия о преступлении, свершившемся в системе Истваан, где сложили головы сотни тысяч лучших воинов Человечества, принесенные в жертву ненасытным богам Хаоса. Полет «Эйзенштейна» будет долгим и трудным, но еще труднее будет убедить правителей Терры в невозможном — в предательстве Хоруса.
fulgrim: Фулгрим, примарх Легиона Детей Императора, видел цель своей жизни в достижении идеала во всем — в войне, искусстве, знании. Но как-то не подумал, что дойти до абсолюта — значит, дойти до края. А то, что обитает за краем, имеет свои представления о границах дозволенного...
descent-of-angels: Все началось на Калибане. Это был мир, покрытый величественными лесами, полный удивительных красот и смертельных опасностей. Отважные рыцари сражались с великими зверями, защищая от чудовищных тварей разрозненные человеческие поселения. И величайшим из рыцарей был Лион Эль Джонсон — примарх Имперского Легиона Темных Ангелов, еще не ведающий о том, что флот его отца, Императора Терры, приближается к Калибану. А пока самым близким ему по духу человеком остается Лютер, когда-то нашедший Лиона ребенком в лесной чащобе. Многому суждено измениться после сошествия Ангелов. Драма, еще далекая от развязки, разворачивается на глазах Захариэля, рыцаря, ставшего одним из имперских Астартес. Ему предстоит стать свидетелем и участником великих и трагических деяний.
legion: Великий Крестовый Поход продолжается. Империум Человечества возвращает под свое крыло миры, утратившие в далеком прошлом связь с Террой. Нурт - один из таких миров. И приведение его к Согласию не должно было вызвать сложностей. Но кампания затягивается и на помощь Имперской Армии приходит Легион Альфа - самый таинственный и скрытный из Легионов Астартес. Никто не может знать, что движет этими могучими воинами, что стоит за их часто парадоксальными действиями. Даже эльдарские провидцы не в силах однозначно предсказать будущее, которое держит в своих руках Альфарий. Ложь и тайна - его оружие. Он предаст Империум. И останется верен Императору.
battle-for-the-abyss: Предательство Воителя стало явным, и для людей, сохранивших верность Императору, настало время тяжелых испытаний. Под угрозой оказалась одна из опор Империума — система Ультрамар, домашний мир Легиона Ультрамаринов, к которой направляется флот Легиона Несущих Слово. Флагманом в этом походе выступает чудовищный корабль, построенный на секретной верфи Механикума, «Яростная бездна», равного которому еще не было. И лишь по чистой случайности об этой угрозе становится известно защитникам Ультрамара. Несколько боевых кораблей разных Легионов Космодесанта, волею судьбы оказавшихся на пути «Бездны», выбирают гибельный для себя, но единственно возможный путь — сражаться.
mechanicum: Разгар восстания Хоруса. Демоническая отрава варпа уже проникла в сердца прославленного Воителя и его верных сторонников. Теперь наступает черёд Марса - планеты-цитадели адептов Механикум. Хрупкое равновесие между противоборствующими фракциями висит на волоске, и планета оказывается на грани разрушительной гражданской войны. Запретное знание тёмной эры технологий, невиданная прежде мощь циклопических боевых машин и древняя ложь, старше самого культа механикум, - таковы силы, которым суждено положить конец союзу Марса и Терры. Спасения нет, и верным Императору воинам осталась лишь надежда, что их жертва не будет бесполезной. Волей судьбы решающую роль в грядущих событиях суждено сыграть Далии Кифере, обычному криптографу. Но под силу ли столь тяжкое бремя простому человеку?
tales-of-heresy: |-
    В сборник вошли рассказы таких звезд, как Дэн Абнет, Грэм Макнил, Джеймс Сваллоу и других не менее талантливых авторов.

    В тридцать первом тысячелетии Человечество ведет Великий Крестовый Поход за воссоединение разрозненных миров под крылом Империума.

    И настал день, когда Император возложил бремя командования этой грандиозной кампанией на плечи примарха Хоруса. А когда тот повернул оружие своих Легионов против Империума, развязав братоубийственную войну, наступило время испытаний. Эта смута, получившая название Ересь Хоруса, полна историй как величайшего предательства, так и беспримерного героизма, страданий и сомнений, трагедий и доблести, побед и поражений.
fallen-angels: После трагических событий на Сароше часть Легиона Темных Ангелов по приказу своего примарха Льва Эль'Джонсона возвращается на родной Калибан. И с ними — Лютер. Согласно официальной версии, эти Астартес должны обеспечить качественную подготовку рекрутов для Легиона. Но вряд ли это может кого-то обмануть. На самом деле воины прекрасно понимают, что это опала. Ссылка... Родной мир встретил их недобро. Став частью Им-периума, Калибан не обрел покоя и процветания. Его бескрайние леса были вырублены, горы выпотрошены, люди согнаны в рабочие лагеря. То тут, то там вспыхивают мятежи. В конце концов Лютер будет вынужден бросить на их подавление Астартес и обнаружить, что во главе заговора стоят его бывшие братья-рыцари. Но и это не самое страшное. Очень скоро становится ясно, что изначальное зло пустило корни в самое сердце Калибана. И вырвать его можно только вместе с сердцем.
a-thousand-sons: Великий Крестовый Поход достиг своего апогея. Воины Легиона Тысячи Сынов были наиболее искушенными в эзотерических науках, искусстве управлять психической энергией и ориентироваться в потоках Великого Океана. Их родная планета Просперо была средоточием наук и искусств. Но сколь бы ни были воины Легиона и их примарх Магнус Красный верны и преданы Империуму, это не избавило их от подозрений в темном колдовстве. И в конце концов на совете в Никее Император запретил Магнусу и его воинам, равно как и библиариям других Легионов, исследования варпа и использование сил псайкеров. Когда же злополучный примарх провидит предательство Хоруса и в отчаянии пытается предупредить Императора, используя запрещенные силы, он ставит под удар свой Легион, ради спасения которого когда-то давно он принял помощь сил Хаоса. И время платить долги...
nemesis: После резни на Исстваане V Хорус провозгласил открытую войну против Империума. В тайном зале Императорского Дворца собирается могущественный совет, члены которого никогда не видели лиц друг друга. Совет собирается после очередной провальной попытки устранить Архипредателя усилиями подосланного профессионального ассасина. Официо Ассасинорум решает отправить целую команду агентов, чтобы все-таки достичь цели и остановить гражданскую войну в Империуме Человечества. И очень скоро все маски будут сброшены...
the-first-heretic: Распространив Великий Крестовый Поход от края до края галактики, Император внезапно решает жестко наказать легион Несущих Слово - за слишком медленное приведение к Согласию новых миров и религиозное поклонение ему, Императору Человечества. Для вящей убедительности он приказывает стереть в пыль город, бывший гордостью Несущих Слово. Унижение легиона серьезно пошатнуло душевное равновесие примарха Лоргара и направило его духовные поиски к самому краю материальной вселенной, где варп просачивается в реальный мир, где слышны голоса богов и можно прикоснуться к истине. Эта истина, неприглядная и болезненная, и станет колыбелью Великой Ереси.
prospero-burns: Император в ярости. Примарх легиона Тысячи Сынов, Магнус Красный, совершает страшную ошибку, поставившую под угрозу безопасность самой Терры. Не имея другого выбора, Император поручает Леману Руссу, примарху легиона Космических Волков,арестовать брата на его на родном мире Просперо. Планета Колдунов — нелегкая добыча, но Волки Русса неудержимы. Разъяренный и опечаленный, Русс намерен привести Магнуса на суд и покорить Просперо. Или уничтожить их.
age-of-darkness: 'После предательства на Исстваане, Хорус начинает кампанию против Императора. Галактическая война на пороге Терры. Но открытому противостоянию сына и отца предшествовали долгие семь лет, полные тайн, молчания, планов и сосредоточения сил среди далеких звезд. Рассказы этого сборника прольют свет на самые темные годы Ереси Хоруса, и на поверхность всплывут откровения, которые потрясут основы Империума. «Эпоха Тьмы» представляет новые главы эпического конфликта, принадлежащие перу лучших авторов Черной Библиотеки: Дэна Абнетта, Грэма Макнилла, Джеймса Сваллоу, Аарона Дембски-Боудена и других.'
the-outcast-dead: |-
    Галактика полыхает в огне гражданской войны. Верные Императору примархи готовятся к битве с Хорусом и предательскими легионами на черных песках Исстваана. Эти темные времена предвещают еще более страшные события. Астропат Кай Зулан случайно становится хранителем, точнее - хранилищем секрета, способного повлиять на ход войны и изменить будущее. Спрятанная в его мозгу информация предназначена только одному человеку во всей вселенной, но вытрясти ее из несчастного астропата считают своим долгом многие. Зулан становится заложником своего дара и вынужден бежать вместе с компанией заключенных самой строгой тюрьмы Терры. Компания довольно примечательная - Астартес, когда-то именуемые Воинством Крестоносцев, а ныне называющие себя Отверженными Мертвецами.
     Кай Зулан должен решить, кому вручить свою верность и невыносимое знание. Или некоторым тайнам лучше оставаться тайнами.
deliverance-lost: Когда Ересь расколола Империум, примарх Коракс и его Гвардия Ворона едва сумели вырваться из капкана, расставленного Хорусом на Исстваане V. Пытаясь залечить раны, нанесенные его легиону, Коракс устремляется на Терру - искать помощи своего отца, Императора Человечества. Получив доступ к древней тайне, Коракс начинает восстанавливать легион, строя планы отмщения предателям. Но в ряды Гвардии Ворона уже проникли лазутчики самого хитрого и двуличного из примархов-предателей - Альфария. Планы Коракса висят на волоске, а вместе с ними и будущее Галактики. Ведь если тайна создания примархов и Астартес попадет в руки Хоруса, резня в Исстваане покажется мелочью на фоне сражений грядущего.
know-no-fear: Не имеющий понятия о прогрессирующей Ереси, и следующий таинственным приказам Мастера Войны, Робаут Гиллиман возвращается в Ультрамар, чтобы подготовить свой легион к войне против орков, обосновавшихся в системе Веридиан. Без предупреждения их предполагаемые союзники из легиона Несущих Слово начинает разрушительную атаку на Калт, рассеивая флот Ультрамаринов и убивая всех, кто встанет на их пути. Это подтверждает худшее развитие событий, какое только мог себе представить Гиллиман - Лоргар намерен завершить их вражду раз и навсегда. Предатели вызывают демонов и все силы Хаоса, Ультрамарины вступают в мрачную и смертельную схватку, в которой ни одна из сторон не может одержать победу.
the-primarchs: |-
    Созданные по образу и подобию Императора, примархи привыкли считать себя принцами Вселенной и хозяевами своей судьбы – они вели легионы космических десантников в славном завоевании Галактики, и никакой враг Империума не мог противостоять им. Тем не менее, даже среди этого легендарного братства были посеяны семена инакомыслия, причем задолго до того, как свершилось величайшее предательство и Воитель Хорус разжег пламя Ереси.

    В этой антологии собраны четыре новеллы, посвященные могущественным примархам: Фулгриму, Льву Эль’Джонсону, Феррусу Манусу, и близнецам Альфарию и Омегону. И хотя роли давно розданы, им еще только предстоит развязать войну, которая навсегда изменит лицо Империума.
fear-to-tread: На Сигнус Прайм идет война, и Хорус посылает Кровавых Ангелов в систему Сигнус, где своего часа ждет армия демонов Кхорна. План военачальника состоит в том, чтобы использовать ошибку в генах Ангелов, которая позже станет известной как Красная Жажда, и заставить их поклониться Богу Крови. В разгар битвы Сангвиниус скрещивает оружие с Ка’Бандхой Жаждущим Крови. Кровавые Ангелы вынуждены сражаться за свои души и тела.
shadows-of-treachery: Бушует самая грандиозная война в истории человечества. Тени предательства протянулись от черных песков Исстваана до самой Терры. В то время как отступнические легионы продолжают сеять ужас по Галактике, идут работы по превращению Императорского Дворца в чудовищную цитадель, защитникам которой предстоит встать между Хорусом и Императором.
angel-exterminatus: Пертурабо – мастер осады и палач Олимпии. Долгое время он жил в тени своих братьев-примархов, недовольный обыденными и позорными заданиями, которые выпадали его Легиону. Когда Фулгрим предлагает ему возглавить экспедицию, отправляющуюся на поиски древнего и опасного оружия ксеносов, Железные Воины и Дети Императора объединяются и отправляются прямиком к эпицентру звездного водоворота. Преследуемые выжившими после резни на Истваане V и призраками с мертвой эльдарской планеты, им нужно работать быстро, если они хотят освободить разрушительную силу Ангела Экстерминатус!
betrayer: Теневой крестовый поход начался. Ультрамарины ослаблены внезапным нападением Кор Фаэрона на Калт, Лоргар Аврелиан ведет Несущих Слово в самое сердце Ультрамара. Их временные союзники - Пожиратели Миров во главе со своим примархом Ангроном - равнодушны к истинным целям миссии и предпочитают опустошать каждый цивилизованный мир, который попадается им на пути. Но если однажды Лоргар покарал своенравного брата, то теперь только поощряет его бешеную бойню. Миры горят, легионы вступили в жестокое противоборство… судьба всей галактики висит на волоске.
mark-of-calth: Ересь пришла на Калт без предупреждения. Всего за несколько часов Несущие Слово уничтожили своих бывших братьев — гордых воинов Ультрамаринов. Теперь, когда мир выжжен вспышками изувеченной звезды Веридии, выжившие должны дать бой XVII легиону и их бесчестным союзникам или встретить свое проклятие в мрачных убежищах аркологий под поверхностью планеты.
vulkan-lives: Выжившие в исстванской резне воины из легиона Саламандр долго и безуспешно пытаются отыскать своего поверженного примарха. Они не знают, что Вулкан, к своему несчастью, еще жив... и томится в плену, где служит игрушкой жестокому тюремщику, собственному брату Конраду Курцу. Под жуткими пытками, призванными сломить и тело, и дух, Вулкан увидит глубину нравственного падения Ночного Призрака — и раскроет тайну, которая способна изменить ход всей войны.
the-unremembered-empire: Далеко на Восточной Окраине расположены миры Ультрамара. Пережив нападение Несущих Слово на Калт и последовавший за ним Теневой крестовый поход против Пятисот Миров, примарх Ультрамаринов Робаут Жиллиман теперь собирает соратников на Макрагге — как он предполагает, новой будущей цитадели человечества. Жители Ультрамара изолированы от Терры страшным варп-штормом. Вся остальная Галактика охвачена огнем войны. С прибытием множества беженцев различия между друзьями и врагами начинают стираться. Сможет ли теперь Жиллиман посоперничать в могуществе с отступником Хорусом?
scars: 'Известие о мятеже Хоруса раскололо легион Белых Шрамов: одни полагают, что лишь Терра может претендовать на их верность, другие вверяют выбор своего пути магистру войны и воинским ложам. Зов о помощи Лемана Русса, примарха Космических Волков, приходит в систему Чондакс одновременно с яростным флотом Альфа-Легиона. Ответить на зов Терры? Вспомнить о давней дружбе с магистром войны? Помочь Леману Руссу? Сведения противоречивы, любое решение сомнительно. А выбор Джагатай-хану, примарху Белых Шрамов, предстоит сделать здесь и сейчас. Каким он будет? На чьей стороне выступит легион — Хоруса или Императора?'
vengeful-spirit: Некогда ярчайшая звезда Империума и первый среди братьев-примархов, Хорус вовлек легионы Космического Десанта в самый кровавый конфликт из всех, что когда-либо видела Галактика. Пока союзники воюют на тысяче фронтов, XVI легион обрушивается на рыцарский мир Молех — гнездо правящего дома Девайнов и важнейший опорный пункт Имперской Армии. Верные Императору силы готовы бросить вызов магистру войны, но что могло заставить Хоруса атаковать столь хорошо защищенную планету? Чем он намерен пожертвовать ради воплощения своего темного предназначения?
the-damnation-of-pythos: После Резни в зоне высадки Исствана V разбитый и обескровленный отряд Железных Рук, Гвардии Ворона и Саламандр перегруппировывается на, казалось бы, незначительной планете. Отражая нападения немыслимых чудовищ, своенравные, разделенные взаимным недоверием союзники обретают надежду после встречи с беженцами, бегущими от ужасов разгорающейся войны и выброшенными течениями варпа в эту далекую звездную систему. Космические десантники пытаются построить убежища для людей в сердце джунглей Пифоса, не подозревая, что над ними уже сгущается тьма...
legacies-of-betrayal: Лишь великие конфликты порождают подлинных героев. В час, когда Галактика пылает и война невообразимых масштабов разрывает Империум на части, чемпионы света и тьмы по воле своих господ сходятся на бесчисленных полях брани. Они не ждут почтения или наград — лишь стремятся встретить судьбу лицом к лицу, ибо только приняв ее, они смогут понять, что ждет их в незримом будущем... В антологию вошли восемнадцать рассказов Грэма Макнилла, Аарона Дембски-Боудена, Ника Кайма и других авторов, а также повесть Криса Райта «Братство Бури», которая позволит заглянуть в душу Белых Шрамов — легионеров, чья натура таинственна, а верность Императору сомнительна.
deathfire: Выжившие Саламандры ищут цель и надежду. Вулкан лежит в гробу под крепостью Геры, однако многие его сыны отказываются верить, что он действительно мертв. Артелл Нумеон, бывший капитан Погребальной Стражи, чудом спасенный Ультрамаринами, призывает других Саламандр на Макрагге покинуть Империум Секундус и вернуть тело примарха на родной Ноктюрн, чтобы возродить его в пламени горы Смертельный Огонь. Но Нумеона продолжают терзать сомнения и страхи за будущее легиона, а враги между тем строят новые планы…
war-without-end: 'Мечты Императора о возвышении и господстве человечества рассыпались прахом. От Великого крестового похода остались лишь тающие воспоминания. Веры в единство больше нет. Мятеж Хоруса простирается во все уголки Империума, едва ли не каждый день война охватывает все новые миры и целые звездные системы. Кто-то начинает задаваться вопросом: возможно ли было все это предвидеть? Но в темные времена только одно ясно наверняка — Галактика больше никогда не познает мира...'
pharos: Империум Секундус, управляемый с Макрагга благородным императором Сангвинием, остается единственным оплотом надежды, пока силы Воителя продолжают разорять остальную Галактику. Робаут Жиллиман, продолжающий быть Владыкой Ультрамара, убедил своего брата, что Терра пала, но человечество может быть спасено таинственной горой Фарос на Соте. Однако Повелители Ночи — не знающие жалости сыны Конрада Курца — уже давно следят за ними из теней и готовятся нанести удар по самому Фаросу...
eye-of-terra: Галактика пылает по приказу Хоруса, каждое мгновение обрываются миллиарды жизней... Но так было не всегда. Некогда титул магистра войны означал честь, гордость и непоколебимую веру в могущество легионов Космического Десанта. Быть может, следуя мириадам нитей смирения и непокорности судьбе, уже опутавших примархов и их сыновей, мы сможем осознать ту горечь, что способна разъесть даже самые непреклонные души... В антологию, которую вы держите в руках, вошли пятнадцать рассказов о Ереси Хоруса, написанных Грэмом Макниллом, Ником Каймом, Гэвом Торпом и другими ав- торами. Аарон Дембски-Боуден в своей знаменитой повести «Аврелиан» вновь возвращается к теме паломничества Лоргара в Око Ужаса и ключевому вопросу — что же могло заставить истинного слугу Императора принять силы Хаоса?
the-path-of-heaven: Пятый легион слишком долго бился на периферии Империума, оставаясь в неведении о мятеже магистра войны и конфликте, что неизбежно вспыхнул следом. Лишь после того как их примарх Джагатай-хан твердо убедился, что встал на праведный и верный путь, Белые Шрамы выбрали сторону и атаковали изменников по всем фронтам. Но теперь, четыре года спустя, неукротимый дух бойцов сломлен безжалостной войной на истощение против Гвардии Смерти и Детей Императора. Чтобы легион смог сразиться в решающей апокалиптической битве, грозовые пророки Хана должны отыскать прямую дорогу на Терру.
the-silent-war: Пока лоялисты и предатели сражаются в тысячах битв по всей Галактике, в тенях идет война совершенно иного рода, в ней правят коварство и изощренные уловки. Многим неведомое, это противостояние таит в себе ключ к столь желанной обеими сторонами победе. Рогал Дорн и его легион готовятся оборонять Солнечную систему от армий магистра войны Хоруса, а Малкадор Сигиллит под покровом тайны раздает указания своим агентам и шпионам. Незримыми руками творится будущее Империума...
angels-of-caliban: Темные Ангелы разбросаны по сотне звездных систем. Их примарх, Лев Эль’Джонсон, занимает пост лорда-защитника Ультрамара, но его истинные мотивы известны немногим, а давняя вражда в родном мире легиона может привести к всеобщему расколу. Безжалостные действия Льва после атаки Повелителей Ночи на Соту вновь ставят Империум Секундус на грань гражданской войны. Даже самые грозные бойцы Крыла Ужаса и знание сокровенных тайн Ордена не гарантируют Эль’Джонсону победу, если он выступит против своих верных братьев.
praetorian-of-dorn: После Улланора Рогал Дорн и VII легион оставили Великий крестовый поход ради другого задания — они стали преторианцами Императора. Но лишь после предательства магистра войны стало ясно, насколько важна эта священная миссия. Когда впервые за все время сражений Солнечная система оказывается под ударом, в оборонительных рубежах, возведенных Имперскими Кулаками и на первый взгляд безупречных, обнаруживается немало брешей. Все готовятся дать отпор новому врагу у ворот Терры. Но кто защитит самого Дорна от внутренней угрозы?
corax-soulforger: Пережив Исстван и выстояв на Освобождении, Гвардия Ворона продолжает сражаться. Примарх Корвус Коракс созвал под своими знаменами бесчисленное воинство, ко- торое дает отпор армии предателей на всех фронтах. От его гнева не укроется никто — ни развращенные техноеретики Механикум, ни кровожадные легионеры Сыны Хоруса. Кораксу удалось остановить распространение порчи, искажавшей тела его космодесантников, но по силам ли ему спасти их дух? И какая участь ждет тех, кто давно породнился с тьмой?
the-master-of-mankind: Пока восстание Хоруса выжигает Галактику, в подземельях под Императорским Дворцом идет еще одна война. Кустодианская Гвардия, также известная как Десять Тысяч, вместе с Сестрами Безмолвия и армией техножрецов генерала-фабрикатора Кейна сражается за контроль над ближайшими к Терре ключевыми узлами древней Паутины эльдаров против демонических сущностей, которые прорвались в тоннели по следам Магнуса Красного. Но теперь, когда к войскам Хаоса присоединились легионеры-предатели и оскверненные титаны, петля вокруг Тронного мира начинает стягиваться, и никто, кроме самого Императора, не сможет одержать победу в этой битве.
garro: Странствующий воин Легионес Астартес, закованный в серое, преклоняет колено перед регентом Терры и торжественно принимает новые обязанности. Он — Натаниэль Гарро, некогда командир «Эйзенштейна», а ныне агент-прим Малкадора Сигиллита. Где бы ни оказался космодесантник — на разоренном Исстване или в залах самого Императорского Дворца, — он всегда готов вступить в бой с вероломными союзниками Хоруса. Но Гарро идет собственным путем, на котором однажды задастся вопросом о своем месте в Империуме... и что, если легионер дрогнет подобно другим? Перед вами сага о Натаниэле Гарро, составленная на основе цикла аудиопостановок. Их сценарии были исправлены и дополнены так, чтобы наилучшим образом передать изначальный замысел автора и подвести сюжет к событиям повести «Обет веры», завершающей роман. Гарро еще на шаг приближается к своей неизбежной участи — стать первым истинным мучеником веры, проповедуемой «Лектицио Дивинитатус».
shattered-legions: Доведенные почти до саморазрушения катастрофой на Исстване V, Железные Руки алчут мести за убийство своего примарха Ферруса Мануса. Объединившись с выжившими воинами Гвардии Ворона и Саламандр, используя любые корабли, способные к варп-прыжкам, они ведут с предателями по всей Галактике войну на истребление — войну, спланированную легендарным военачальником Шадраком Медузоном. В этом сборнике о Ереси Хоруса вы найдете десять рассказов от Дэна Абнетта, Криса Райта, Джона Френча и других авторов. А в повести «Седьмой Змей» Грэм Макнилл приглашает читателей навестить разношерстный экипаж звездолета «Сизифей», затянутый в паутину противостояния с Альфа-Легионом.
the-crimson-king: 'После сожжения Просперо примарх Магнус Красный таинственным образом переправил Тысячу Сынов на Планету Чернокнижников в глубинах Ока Ужаса. Там, вдали от событий, тревожащих остальную Галактику, Циклоп с безразличием взирал на разгорающуюся Ересь магистра войны. В поисках смысла жизни Алый Король всецело посвятил себя сохранению знаний из великих библиотек Тизки, надеясь, что человечество вновь поймет важность просвещения. Но сыны Магнуса уже замечают происходящие с ним изменения. Душа их примарха расколота, его разум и воспоминания понемногу растворяются в круговоротах варпа. Есть лишь один способ восстановить Циклопа: если его воины сумеют вернуться на места их величайших триумфов и трагедий, Губительные Силы заново коронуют Алого Короля.'
tallarn: По мере того, как кампания Магистра Войны набирает обороты по завоеванию галактики, его генералы ищут новые поля битв для завоеваний. Оставив позади мёртвый мир Идрис, Пертурабо решает нанести удар по Талларну. Злобный и мстительный примарх Железных Воинов обрушивает на планету смертоносную бомбардировку, убивая миллионы, но в тоже время сплачивает выживших. В результате возникает жестокий, всепоглощающий вооруженный конфликт, величайший из войн, в котором обе стороны используют тяжёлую военную технику. Но причины нападения Пертурабо больше, чем развязывание карательного уничтожения против сил Империума — у него есть совершенно более тёмная цель.
ruinstorm: Когда до Макрагга доходят вести о том, что Терра еще держится, идея Империума Секундус становится безумством. Ободренные новостями Сангвиний, Робаут Жиллиман и Лев Эль’Джонсон отправляются в путешествие, чтобы защитить Императора и искупить свои грехи. Однако Гибельный шторм — охватившая всю Галактику буря энергий Хаоса — прячет Тронный мир от примархов. Флоты трех легионов покидают Ультрамар, и примархи не остановятся ни перед чем, охваченные желанием исполнить долг и спасти Галактику. Но коварный враг следит за каждым их движением и плетет козни, целясь в слабые места блудных сынов Императора.
old-earth: Примарх Вулкан, телом и духом возродившийся в глубине горы Смертельный Огонь, призывает самых преданных сыновей и готовится к заключительному этапу своих странствий. Разбитые на Исстване V, легионы приостановили победоносное шествие магистра войны по Галактике, но таинственные слухи о возвращении Ферруса Мануса порождают новые противоречия в союзе Железных Рук, Саламандр и Гвардии Ворона. Ощущение незавершенности затрудняет выбор Вулкана — принять участие в войне возмездия против предателей или следовать по своему зыбкому пути к Тронному миру.
the-burden-of-loyalty: Пока война неторопливо накрывает Галактику пологом тьмы, по-прежнему лояльные Трону люди борются за выживание и спасение всего, что им дорого. Грозные флоты Хоруса неумолимо приближаются к Терре, и задача остановить натиск предателя выпадает именно таким героям, но собранные против них враги могучи, а бремя верности поистине тяжело...
wolfsbane: Пришло время Леману Руссу, повелителю Космических Волков, исполнить свою клятву и попытаться остановить магистра войны Хоруса, пока тот не прорвался в cегментум Солар. Несмотря на возражения трех братьев-примархов, Русс уводит VI легион с Терры и спешит навстречу Луперкалю. Судя по докладам агентов Малкадора Сигиллита, Хорус полностью изменился и обрел настолько огромную демоническую силу, что ни один человек не выстоит против него. Ни один воин Фенриса не возьмет обратно данное слово, но, выступив против Луперкаля, неуязвимого для клинков смертных, Повелитель Зимы и Войны может погубить себя, защищая свою честь…
born-of-flame: Саламандры, рожденные в огненном мире Ноктюрн, верят в самопожертвование и священное право человека на жизнь. В этом мире их отец Вулкан, ставший примархом Императора Человечества, вырос в семье простого кузнеца и выковал легион своих сынов. Их история — сага о героизме, предательстве, трагедии и возрождении. Не раз побывав на самом краю, они всегда возвращались, готовые к бою и никогда не сдающиеся. Легион и его примарх превратились в воплощение вызова всем превратностям судьбы. На наковальню, рожденные в пламени!
slaves-to-darkness: 'После долгой, изматывающей войны предательские легионы подбираются вплотную к Терре. Но время играет против них. Примархи Робаут Жиллиман и Лев Эль’Джонсон уже в пути, и, возможно, вместе их армии сумеют отразить атаку. Войскам магистра войны необходимо объединиться: только так они смогут пробиться к самому Трону. Мортарион отправляется вперед, и на плечи Лоргара и Пертурабо ложится обязанность вернуть в строй Фулгрима и Ангрона, обретших демоничество и презревших власть магистра войны. Сам Хорус тяжело ранен — и в преддверии величайшей битвы из всех, что когда-либо видела Галактика, Малогарсту приходится собирать расколовшийся легион воедино и вытаскивать своего повелителя едва ли не с того света.'
heralds-of-the-siege: Галактика горит, брат идет против брата. Кампания, начавшаяся с измены любимого сына, движется к судьбоносной развязке. Магистр войны берет верх — гигантская армада Хоруса наконец достигает Терры, где находится почитаемый Трон его ненавистного отца. Многие пали, приближая этот час, и легенды о них, обратившись в пепел, щедро удобрили землю, на которой взошла и расцвела Ересь. Другие, чьи судьбы подобны каплям в океане крови и сражений, тоже сыграли свои крошечные роли. Все это уже не имеет значения. Глядя в небеса, Терра готовится к обороне. Собираются армии, герои воздевают клинки, гражданские дрожат от страха. Война идет к ним, и ничто ее не остановит...
titandeath: Собирается армада Хоруса… Она уже разбила всех посланных против нее противников, даже личного палача Императора. Осталось преодолеть последнюю преграду, и она нанесет удар по Терре, разбивая в пыль мечту Владыки Людей. Система Беты Гармона расположена на самом прямом и удобном пути к Солнечной системе и Терре. Для ее завоевания Хорус собирает колоссальные силы и невероятное количество титанов. Поражение здесь равносильно поражению во всей войне, и Луперкаль не намерен отступать. Но Империум тоже понимает значение Беты Гармона. Из почти неисчислимых резервов Имперской Армии и мобилизованных отовсюду титанов формируются огромные силы, способные противостоять боевой мощи магистра войны. Богомашины мятежников и лоялистов вступают в войну, и титаны сражаются против титанов. Этот конфликт не похож ни на один другой, и итог битвы определит ход следующего этапа войны.
the-buried-dagger: Над Террой сгущаются тучи — близится решающая битва за Трон… Примархи-отступники собираются под знаменами магистра войны, и именно Мортариону выпадает жребий стать в авангарде армии предателя. Но дорога полна трудностей — сначала примарх вместе с легионом заблудился в варпе, а затем на кораблях начала бушевать жуткая чума. Некогда славные своей выносливостью, Гвардейцы Смерти оказываются бессильны перед обрушившимися бедами. Чтобы спасти легион, Мортарион вынужден согласиться на чудовищную сделку и погубить своих сыновей навеки. Тем временем на Святой Терре тайно орудуют провокаторы, еще до прибытия войск Хоруса подстрекающие местных жителей на мятежи и беспорядки. Малкадор Сигиллит берет дело в собственные руки, стремясь положить конец всем распрям, но вскрывает заговор, — и чтобы распутать этот клубок, ему потребуются все его хитроумие и воинские навыки.
the-solar-war: После семи лет ожесточенных битв чудовищная междоусобная война, названная Ересью Хоруса, наконец приближается к завершению. Теперь взор магистра войны обратился на Терру — Тронный мир и средоточие власти его отца. Хорус жаждет лишь одного исхода — смерти Императора и полного подчинения Империума. Мятежный сын принял Хаос, став его вознесенным сосудом, и собрал под свои знамена несметную армию, призванную вершить его волю и возмездие. Но путь к Трону предстоит нелегкий, ибо защищает его примарх Рогал Дорн — Преторианец Терры и главнокомандующий обороной. Прежде всего Хорус должен бросить вызов самой системе Сол, ее многочисленным армадам и крепостям. Лишь победив в Солнечной войне, Хорус сможет ступить на землю Терры. Тем знаменуется первый этап величайшего сражения за всю историю человечества.
the-lost-and-the-damned: |-
    На тринадцатый день секундуса бомбы упали на Терру...
    Сокрушив оборону Солнечной системы превосходящими силами предательской армады и колдовством варпа, Хорус обрушил на Тронный мир всю свою ненависть. Вслед за массированной бомбардировкой у стен Дворца разворачивается невообразимое по масштабу сражение, в котором каждый шаг вперёд даётся ценой миллиардов жизней. На передовой царит сущий кошмар, и сам воздух стал ядом и напитался кровью. Жестокая мясорубка без устали перемалывает всё больше жизней, и внешним укреплениям не выстоять долго даже с помощью верных примархов, ибо Хорус тоже призвал своих полководцев... Мортарионова чума и ярость Ангрона рано или поздно сломят сопротивление защитников.
the-first-wall: Ожесточенная война за судьбу человечества продолжается. Хотя внешние оборонительные системы уже пали, стены Дворца стоят нерушимо благодаря стратегическим талантам Рогала Дорна, Преторианца Терры, и Силам обороны удается сдерживать неисчислимые армии Хоруса. В лице Пертурабо, осадного мастера предателей, Дорн сталкивается с противником равного таланта. Начинается ужасная война на истощение, и в центре этого противоборства — решающая битва за космопорт Львиных врат. Овладев им, предатели смогут доставить на поверхность Терры свои самые мощные и разрушительные орудия. Примарх Имперских Кулаков знает, что войска лоялистов обязаны удержать космопорт любой ценой, но враги атакуют со всех сторон, а теперь к резне присоединяются и нерожденные. Смогут ли защитники Империума выстоять?
saturnine: Воинство Предателей во главе с Хорусом Луперкалем все крепче сжимает Императорский дворец в тисках. Стены и башни одна за другой начинают сминаться и рушиться. Рогал Дорн, Преторианец Терры, удваивает усилия, чтобы сдержать неумолимого врага, но у обороняющихся гораздо меньше людей и катастрофически не хватает огневой мощи. Дорн просто не способен защищать все и сразу. Теперь любая попытка выжить требует жертв, но какие битвы Рогал осмелится проиграть, чтобы добиться успеха в других? Возможен ли один тактический ход, один решающий бой, который навсегда переломит ход войны и принесет защитникам победу?
mortis: Сатурнианские победы истаяли, как вчерашние надежды. Жертвы в космопорте стены Вечности были напрасны. Отброшенные, но не побежденные, предатели с новыми силами штурмуют Дворец. Теперь главные космопорты в руках Луперкаля, и магистр войны истощает небеса, вводя в бой резервы. Натиск крепнет, растет и могущество Хаоса. Наяву защитники тонут в отчаянии, а грезы гонят их на поиски ложного рая. Когда фортификации рушатся и воля лоялистов слабеет, Хорус приказывает титанам Легио Мортис пробить стены Дворца. Изменникам противостоят мощь стены Меркурия и войско Легио Игнатум. Древние соперники, богомашины двух легио, сходятся в битве, а внутри укреплений горстка отчаянных людей пытается отвратить волну пагубного влияния варпа. По всей Терре воины и странники, блуждая в пустошах и садах ужаса, идут домой и к неизвестному грядущему.
warhawk: 'Внутренние стены разрушены. Авангард предателей рвётся к сердцу Дворца, предчувствуя победу. Предпринимаются отчаянные гамбиты: в руины выпускают святую поневоле и усердного грешника. Поднимается чёрный меч, выкованный во злобе, готовый творить легенду. Но среди бойни Джагатай-хан, Боевой Ястреб Чогориса, готовится нанести самый дерзкий удар во всём противоборстве. Его цель — ни много ни мало — освобождение космопорта Львиных врат. Отрезанный от любой помощи, он ставит всё на одну отчаянную контратаку, предпринятую против старого врага, который стал намного сильнее. Выступая против недавно коронованных повелителей жизни и смерти, Белые Шрамы понимают, что поражение погубит не только их легион, но и саму Терру.'
echoes-of-eternity: Стены пали. Защитники сломлены. Внутренний дворец лежит в руинах.Сквозь огонь и пепел умирающей Терры наступает орда Магистра Войны, и верные Императору войска вынуждены отступить к Дельфийскому укреплению — к самым стенам Санктума Империалис. Ангрон, примарх Пожирателей Миров и Вестник Хоруса, погиб и возродился бессмертным, и теперь он ведёт армии проклятых, словно гневный прилив, уничтожая всё на своем пути, а варп тем временем отравляет самую землю Терры. Для осажденных армий Императора надежды не осталось. Хан на краю гибели. Рогал Дорн окружён и продолжает войну в бастионе Бхаб. Гиллиман не успеет добраться до Терры. Без своих братьев Сангвиний — Ангел Девятого легиона — ждёт на последней стене, надеясь объединить отчаявшихся защитников и беженцев для последней битвы.
the-end-and-the-death-volume-i: Выхода нет. Стены рухнули, ворота снесены с петель, а их защитники убиты. Пришло время конца и смерти. Спустя семь лет жестокой братоубийственной войны некогда возлюбленный мятежный сын находится в шаге от победы. Хорус Луперкаль пришёл убить отца. Император, сияющий светоч для многих и беспринципный тиран для некоторых, должен умереть. Война сгубила несметное количество жизней, и даже примархи, когда-то мнимые бессмертными, нашли свою погибель на полях сражений. Мечте Императора пришёл конец, но искра надежды ещё теплится. И теперь, в последний час последнего дня, Повелитель Человечества поднимается с Трона. С ним рядом стоят его Ангел, его Преторианец и его Капитан. Все они готовы обрушить на врага ужасное возмездие. Но надежда призрачна, ибо магистр войны всеведущ, и окончательный триумф Хаоса близок как никогда...
the-end-and-the-death-volume-ii: 'Терра в осаде. Итог войны лежит на качающихся чашах весов. Семилетний кровавый поход Магистра Войны Хоруса достиг своей цели — колыбели человечества. И теперь сын должен убить отца. В решающий момент Сангвиний, примарх верных Императору Кровавых Ангелов сходится в битве с кошмаром, поселившимся на «Мстительном духе», флагмане Магистра Войны, с одной лишь целью: убить Хоруса, обезглавить предателей, положить конец Ереси и не дать силам Хаоса захватить Терру. Но, потакая желаниям падшего Магистра Войны, Тёмные боги постараются помешать Сангвинию выполнить задачу. Война приближается к взрывному, кровавому завершению, и грядущие события либо спасут человечество, либо навеки погрузят его во тьму.'
the-end-and-the-death-volume-iii: "Сангвиний, Великий Ангел, пал от руки брата.\nТерра пылает, сама ткань реальности вокруг планеты выворачивается наизнанку. Величайший бастион человеческой цивилизации замер на краю пропасти. Отчаянные защитники готовятся дать последний бой ордам обезумевших предателей. Тиф осаждает Полую Гору, одну из последних уцелевших крепостей, которую защищают Тёмные Ангелы, а за её стенами укрылись паломники Эуфратии Киилер. Малкадор Сигиллит, охваченный пламенем, восседает на Золотом Троне и пытается купить своему господину ещё немного времени. Но его почти не осталось… \nГиллиман спешит на помощь Тронному миру сквозь межзвёздную тьму. Что он увидит, добравшись до цели: пепелище и Магистра Войны, вознёсшегося до статуса божества Хаоса, или одержавшего победу Императора? И какой ценой? Наступает кульминация. Император схлестнётся с Хорусом в поединке отца против сына."
sons-of-the-selenar: Среди экипажа «Сизифея», сломленного и исчерпавшего запас сил, возникает разлад — десантники из Разбитых легионов разрываются между решением своего возрожденного капитана отправиться на самоубийственное задание и приказом вернуться на Терру и воссоединиться с собратьями. Криптос перехватывает серию невнятных сообщений, и рассорившиеся воины спускаются на поверхность измученной Луны. Здесь им придется проверить на прочность узы братства и преданность долгу и друг другу, когда древние ужасы, рожденные на заре генетических манипуляций, окажутся на свободе, а затем раскроется один давний секрет. За кем бы ни осталась победа в решающем сражении, впоследствии этот секрет повлияет на события, происходящие во всей Галактике...
fury-of-magnus: 'История Магнуса Красного, пожалуй, трагичнее, чем у всех иных сынов Императора, поддавшихся Хаосу. Его наказали за стремление к знаниям, сурово отчитали, осудили и даже раскололи на составляющие элементы, поэтому у Алого Короля много причин жаждать отмщения. Впрочем, не только ради возмездия он примкнул к армиям магистра войны, осаждающим Терру. Магнус ищет недостающую частицу своей сути, один из ее фрагментов, что содержится в самой неприступной крепости на планете — во внутреннем донжоне Императорского дворца. Пока величайшее противоборство многих эпох близится к неистовой кульминации, Алый Король ведет собственную тайную битву. Чтобы вновь стать цельным, ему нужно не только преодолеть самую ожесточенную оборону, но и встретиться с тем, кого он с равной пылкостью любит и ненавидит превыше всех прочих: со своим заблудшим отцом, Повелителем Человечества.'
garro-knight-of-grey: Пока гремит эпическая битва за Терру и будущее человечества висит на волоске, Натаниэль Гарро сражается среди пепла и огня разрушенного Императорского дворца. От жестокого предательства на Исстване до отчаянного бегства «Эйзенштейна», через дебри заданий в качестве агента Малкадора Сигиллита, путь бывшего Странствующего Рыцаря неумолимо влёк его к судьбе, которая может закончиться лишь кровопролитием. Пытаясь защитить Эуфратию Киилер, первую святую Имперской церкви, от ужасов титанической войны, Гарро должен сойтись в последнем сокрушительном противостоянии со злейшим врагом — своим генетическим отцом, прежним господином и чудовищным повелителем Гвардии Смерти, мятежным примархом Мортарионом.
era-of-ruin: |-
    Хорус мёртв. Его Ересь окончена. Шрамы крупнейшего раскола человечества никогда не исцелятся полностью. Те, кто всё пережил, встречают зарю грядущей эпохи Разорения, которая несёт новые начинания и прежде невиданные угрозы для Империума, истерзанного войной и иными потрясениями.
    Это заключительное издание в цикле о Ереси Хоруса, служащем всего лишь прологом гораздо более мрачной легенды, которую будут рассказывать десять тысяч лет. В рассказах из данного сборника перед нами промелькнут истории, связанные с Осадой Терры: мы увидим, как Империум разгребает последствия опустошительных битв, сокрушивших Галактику, и посмотрим, как те, кто сражался по обе стороны фронта, пытаются забыть о немыслимых событиях противостояния и жить дальше.
roboute-guilliman-lord-of-ultramar: Задолго до пришествия Империума королевством Ультрамар правил Робаут Жиллиман, последний король-воин Макрагга. Даже узнав о своем истинном происхождении как примарха, сына Императора Человечества, он стремится расширять владения и словом, и силой подчиненного ему единолично XIII легиона — Ультрамаринов. Теперь, столкнувшись с враждебной империей в мире Тоас, Жиллиман должен осторожно выбирать свое оружие — иначе его мечтам о светлом будущем никогда не будет суждено сбыться.
leman-russ-the-great-wolf: Многие саги повествуют о Лемане Руссе, Владыке Зимы и Войны, самом грозном из примархов - сыновей Императора. На пике Великого крестового похода Космические Волки пытаются привести к Согласию мятежную планету Дулан. Разъяренный непокорностью тирана Дарата, Русс клянется лично казнить правителя, но Лев Эль'Джонсон, брат Лемана и повелитель Темных Ангелов, советует действовать более осмотрительно. Теперь войскам Дарата противостоят два легиона Астартес, но между союзниками растет напряжение, а соперничество Волка и Льва угрожает захлестнуть всех.
magnus-the-red-master-of-prospero: Магнус Красный, таинственный оккультный владыка, долго изучал древнее искусство чернокнижия. Теперь псайкер, сравниться с коим может один лишь Император, командует верным ему легионом Тысячи Сынов в Великом крестовом походе, разыскивая по пути утраченные знания на руинах погибших человеческих цивилизаций. Сражаясь вместе со своим братом, Пертурабо из Железных Воинов, Магнус предчувствует близящуюся развилку судьбы - продолжит ли Циклоп биться во имя общих целей или направит усилия на дальнейшее познание варпа?
perturabo-the-hammer-of-olympia: Взращенный миром, погрязшим в политических играх и борьбе за власть, Пертурабо всегда был уникумом для народа Олимпии — воистину, его философские и научные изыскания не знали себе равных. Но за встречей с Императором последовали десятилетия неблагодарных кампаний Великого крестового похода, а внутри примарха росло недовольство тем местом, что отвели в Империуме его легиону. И когда до него доходят вести о беспорядках на планете, ставшей ему родной, Железный Владыка приказывает своим воинам оставить борьбу против чужаков-хрудов и любой ценой раздавить назревающее восстание...
lorgar-bearer-of-the-word: На планете Колхида могучие церкви правили деградирующей цивилизацией во имя мнимых богов. Все изменилось с появлением Лоргара — примарха, пророка, Золотого. Прирожденного вождя воспитал Кор Фаэрон, жрец Завета, увидевший в ребенке средство для достижения личной власти. Теперь, когда планету охватила религиозная война, на фронтах которой сражается Братство Лоргара, примарха терзают видения о будущем и пришествии Императора. Чтобы найти себе место в новом мире, он должен отыскать баланс между учениями приемного отца и веленьями судьбы, ждущей Уризена среди звезд.
fulgrim-the-palatine-phoenix: Фулгрим, владыка Кемоса, носитель палатинской аквилы и примарх Детей Императора, твердо намерен занять подобающее ему место в Великом крестовом походе. Несравненный мечник, он долго изучал искусство войны и нетерпеливо ждал возможности понастоящему проверить в деле не только себя, но и своих верных последователей. Теперь Фениксиец пытается привести непокорный мир к Согласию при помощи всего лишь горстки лучших воинов легиона. Ему предстоит узнать, что за любую победу нужно платить, и чем грандиознее триумф, тем выше цена...
ferrus-manus-the-gorgon-of-medusa: Великий крестовый поход уже пронесся через половину Галактики, и миллион человеческих миров, принявших власть Терры, учится жить по законам истины и разума. Но за беспрецедентные успехи приходится расплачиваться. По слухам, Император решил покинуть Крестовый поход и назначить своим преемником одного из сыновей-примархов. В это же время человеческая империя Гардинаал непримиримо отвергает Согласие. Феррус Манус, подчинив своему легиону лишенное командира воинство Ультрамаринов, Детей Императора и Тысячи Сынов, накажет непокорных так, что даже Владыка Людей обратит на это внимание.
jaghatai-khan-warhawk-of-chogoris: 'С тех пор как флоты Империума обнаружили Чогорис, обычаи воинского мистицизма Белых Шрамов не раз вступали в противоречие с идеалами Объединения. Пока сражения Крестового похода пылают среди звезд, загадочный примарх Джагатай-хан пытается сохранить уникальность своей армии в Галактике, где правит холодный рассудок. Хотя сам Каган стремится к уединению, братья-примархи втягивают его в величайшую битву воззрений — спор об уместности применения псионических сил в легионах. Так рождается проект библиариумов и растет противодействие ему. Теперь Хан должен решить, чему он верен в первую очередь: Имперской Истине или своим корням.'
vulkan-lord-of-drakes: Во славу человечества Император ведет свои армии к завоеванию Галактики. Легионы один за другим воссоединяются с примархами. В Тарасском Разделе, в борьбе против чудовищного нашествия орков, часть XVIII легиона отчаянно держит оборону, не зная, что их примарх уже найден. В то же время на Ноктюрне Вулкан создает новую армию, которую ждет обретение истинной цели. И вот настал час и им вступить в бой. Владыке Змиев предстоит не только примерить мантию предводителя и спасти своих сынов, но и выковать новое неразделимое целое.
corax-lord-of-shadows: 'Идет Великий крестовый поход, и Корвусу Кораксу поручено покорить колоссальные города-станции у звезды Каринэ. Твердо решив привести эти миры к Согласию, примарх обрушивает на них всю мощь своего легиона и бесчисленных отрядов Имперской Армии. Но оборона повелителей Каринэ крепка, и они готовы на все. В самый разгар боевых действий космический город Зенит-312 подвергается заражению опасным биологическим оружием, созданным в незапамятные времена. В мгновение ока наступление войск Империума было приостановлено — недавние союзники ополчились друг против друга, а Гвардия Ворона осталась один на один с почти непобедимым противником. Вся кампания оказывается на грани провала, и Кораксу предстоит суровое испытание: поддаться жажде мести или быстро и решительно положить конец войне.'
angron-slave-of-nuceria: 'Император лично ведет Великий крестовый поход среди звезд, и нет для Повелителя Человечества ничего важнее, чем отыскать своих сынов, рассеянных по галактике: примархов, каждому из которых суждено возглавить легион космических десантников. После воссоединения любая такая армия становится отражением своего повелителя — как его достоинств, так и пороков. Для XII легиона, бывших Псов Войны, а ныне Пожирателей Миров, черта между достоинством и пороком едва различима. Обремененный воинством, которое ему чуждо, на службе отцу, которого ненавидит, Ангрон ставит сыновей перед тяжелым выбором — выбором, который повернет легион на путь в один конец. Что предпочтут воины, отчаянно желающие отцовского признания: переродиться по его изувеченному образу или воспротивиться ему? И откроется ли им истинное предназначение примарха в за мыслах Императора?'
konrad-curze-the-night-haunter: Конраду Курцу выпала самая мрачная судьба среди всех примархов, бессмертных сынов Императора. Он вырос во тьме Нострамо, планеты худших представителей человечества, воров и убийц. И разве удивительно, что примарх стал воплощением ужаса, известным как Ночной Призрак? Перед вами — трагическое повествование о том, как глава легиона Повелителей Ночи превратился в чудовище, в живое оружие, вселяющее ужас в сердца врагов. Когда-то он верно служил Империуму. Но, увидев всю глубину безумия, в которое погружалась Вселенная, и лицемерия своего отца, не способного на любовь, Конрад принял единственное, в чем оставался хоть какой-то смысл, — Хаос. История Курца, от залитых кровью трущоб городов-ульев на родной планете и до по следних печальных дней мятежного примарха, не похожа на истории его братьев примархов. Повесть о нем пробирает до костей...
lion-el-jonson-lord-of-the-first: |-
    Каждый примарх — уникальное создание, рожденное из генетического материала Императора и воплощающее разные аспекты Его личности. Все они обладают безграничными возможностями, но лишь один имеет право называться Первым. Лев Эль’Джонсон олицетворяет все лучшее, ради чего задумывались примархи, а его легион славится выдержкой, честью и непревзойденным воинским мастерством. Они — верное орудие Владыки Людей, Его непоколебимая карающая длань. Они — Темные Ангелы.
    В то время как Император собирает своих самых могучих отпрысков для нападения на Улланор-Прайм, повелитель Первого ведет свой легион к дальним рубежам известной Галактики, чтобы усмирить один-единственный мятежный мир. Что это — потворство своей печально знаменитой гордости? Или проклятое кладбище погибших империй, нареченное Вурдалачьими звездами, таит нечто такое, о чем Лев не готов поведать даже собственным сынам?
alpharius-head-of-the-hydra: О деяниях сыновей Императора, как славных, так и постыдных, слагают легенды. Но почти ничего не известно о самом загадочном из них — Альфарии. Ибо никто не сравнится с повелителем Альфа-Легиона в умении запутать собеседника. Его склонность к секретности и природная хитрость привели к тому, что даже обстоятельства встречи Альфария с отцом и братьями доныне оставались загадкой. Но как отличить, где кончается обман и начинается истина, если история рассказана устами змеи?
mortarion-the-pale-king: Система Галаспар годами страдала под пятой жестокого Режима. Миллиарды людей трудились ради нескончаемого обогащения своих хозяев, влача жалкое существование в грязи и страхе. Но грехи Галаспара не остались незамеченными Империумом, и сама Смерть приговорила Режим к уничтожению. Мортарион, недавно назначенный командиром XIV легиона, устраивает на планете резню немыслимых масштабов — такую, что приводит Империум в ужас. Желая разобраться в произошедшем, двое благородных примархов прибывают на Галаспар, чтобы призвать брата к ответу. Но Бледный Король не намерен терпеть упрёки, ибо взмах косы всегда собирает жатву.
rogal-dorn-the-emperor-s-crusader: Начинается шестое десятилетие Великого крестового похода. Флоты и армии Владыки Людей пронзают Галактику, неся Имперскую Истину тысячам миров. Расширение шло быстрыми темпами, но теперь пора закрепиться на новых территориях. Тем не менее Повелитель Человечества требует, чтобы границы Империума раздвигали дальше в неизведанное. Он поручает четырём примархам опасное задание — овладеть мирами Окклюды Ноктис. Там находятся сотни звёздных систем, расположенных на дальней стороне Великого Северного варп-шторма, присутствие которого рождает возмущения в эмпиреях и поглощает путеводный свет Астрономикана. Аномалия непроницаема даже для пси-взора Императора, но Рогал Дорн ведёт Седьмой легион в самые недра этого космического сумрака. Отрезанный от союзников, повелитель Имперских Кулаков сражается с врагом, подобных которому ещё никто прежде не встречал. Дорну потребуются весь его непревзойдённый талант стратега и неодолимая воля, чтобы покорить тьму во имя Владыки Людей.
sanguinius-the-great-angel: 'Сангвиний — Великий Ангел, самый горячо любимый из примархов, и его грандиозные свершения прославляют по всему Империуму, пока Крестовый поход всё дальше углубляется в пустоту. Однако происхождение его легиона окутано тайнами и слухами: его уникальное телесное обличье — само по себе загадка, а родной мир Кровавых Ангелов, полный опасностей, остаётся закрытым для всех, кроме его замкнутого народа. Однажды с экспедиционными флотами прибывает раскритикованный летописец, призванный вести хронику деяний примарха, и берётся найти истину, сокрытую за легендами. Сопровождая IX легион в битвах с врагами Императора, этот пытливый исследователь узнаёт гораздо больше, чем ожидал — не только о героях своего труда, но и о природе самого Империума.'
sons-of-the-emperor: 'С момента таинственного появления Сынов Императора на свет и до ожесточенных битв, вспыхнувших после того, как половина легендарных примархов восстала против отца, эти несравненные воины и творцы исторических свершений входили в число самых славных поборников человечества. В данной антологии собраны истории о величайших или мрачнейших поступках восьми из них: от Ангела Сангвиния, в одиночку влачившего бремя самых жестоких деяний своего легиона, и Вулкана, невероятно человечного по меркам своих братьев, до угрюмого Пертурабо, в котором изобретатель и зодчий сочетались с кровожадным полководцем, и Хоруса, затмившего свое ярчайшее сияние тьмой, что разрослась в глубинах его души.'
scions-of-the-emperor: Примархи... Полубоги, сотворенные на основе генокода самого Повелителя Человечества. Полководцы. Завоеватели. Командиры легионов Космодесанта. Предполагалось, что эти отпрыски Императора, наделенные несравненным могуществом, проведут человечество в новую эпоху величия, но гражданская война разделила их на два враждебных лагеря. Одни, вроде стоического Рогала Дорна и возвышенного Сангвиния, сохранили верность мечте своего отца. Другие — например, кровожадный Конрад Курц и непоколебимый Мортарион — отвернулись от Его света и последовали за своим братом Хорусом во тьму восстания. В антологии собраны восемь историй об этих уникальных созданиях, относящиеся как к славным дням Великого крестового похода, так и ко времени перед самой Осадой Терры.
blood-of-the-emperor: Слабый паренек с Хтонии прокладывает среди звезд кровавую дорогу своей судьбы. Клановые воины охотятся на зверя в фенрисийских снегах. Чернокнижники Просперо ищут сокрытые тайны. Преторианец Императора показывает безжалостную сторону своей личности. Альфарий соглашается пройти допрос после жестокой кампании, а Мортарион впервые возвращается на Терру с тех пор, как обрел демоничество. Читая любую из этих шести историй, вы сможете по-новому взглянуть на одного из примархов — сыновей-полубогов Императора. Они, легендарные герои и бывшие братья по оружию, в пору войны и раздора поделились на лоялистов и предателей, но остались могучими полководцами и вождями людей. Каждому из них есть что рассказать...
heirs-of-the-emperor: Объединив три отдельных антологии из серии «Ересь Хоруса. Примархи», а также дополнив пятью дополнительными рассказами, это антология предлагает всестороннее и углубленное представление о примархах, которые возглавляли Легионес Астартес — легендарных воинах, братьях, разорванных на части, наследниках Императора.
valdor-birth-of-the-imperium: Константин Вальдор. Это имя — символ героизма, чести и непоколебимой верности долгу. Ибо именно он командует Легио Кустодес, наиболее почитаемыми и преданными делу отборными воинами. Он — меч Императора; он — Его щит и знамя, и ему нет равных. Закованный в сияющий аурамит и с копьем Стража в руках, он —несокрушимая стена на пути всех врагов Трона, как внешних, так и внутренних. Война за объединение Терры подходит к концу, но Вальдору предстоит вновь испытать себя, проявив отвагу и решительность. Мелкие военные вожди и тираны Старой Земли почти побеждены. Император и его армии ликуют. Но что ждет новорожденный Империум в будущем? Какая судьба выпадет на долю его ныне забытых солдат — Громовых Воинов и армий, что сражались во имя Единства? Появляется новая сила, способная затмить предшественников и открыть дорогу к звездам. Но перемены на Терре редко обходятся без кровопролития, и иногда, чтобы добиться желаемого, необходимо совершить нечто ужасное.
luther-first-of-the-fallen: Лютера держали в заточении десять тысяч лет, не позволяя ему умереть. Он — воплощенное проклятие и избавление Темных Ангелов. Никто не приближен к сердцу и истории капитула настолько, как этот человек, объединивший в себе все аспекты величия Первого легиона и все постыдные черты воинства. Рассказ о его судьбе — легенда о Ереси Хоруса и падении с высот Просвещения, что написана на страницах одной долгой жизни. Слава, честь, гордость, позор и измена сплетаются здесь в гобелен правды и лжи, который верховные великие магистры Темных Ангелов пытались изучить и распустить на протяжении ста кровавых веков. Лютер утверждает, что раскаивается в прежних деяниях, но его ли грехи обрекли капитул на бытие, полное тайн? Или же стоило более внимательно прислушиваться к предостережениям самой истории?
sigismund-the-eternal-crusader: 'Великий крестовый поход заканчивается. Император уже вернулся на Терру, а Хорус ещё действует среди звёзд, завершая объединение человечества. Пока армии людей сражаются в последних битвах той эпохи, летописец Соломон Восс ищет ответ на единственный вопрос: почему Сигизмунд, первый капитан Имперских Кулаков и величайший чемпион среди легионеров, верит, что этой войне не будет конца? Когда повелитель Храмовников удостаивает Восса аудиенции, которые даёт нечасто, поиски ответа уводят летописца в полное откровений путешествие во времена, предшествовавшие тому, как Сигизмунд стал космодесантником, а оттуда, через его первые битвы и клятвы, — к самым жестоким поединкам между Легионес Астартес.'
eidolon-the-auric-hammer: |-
    Анналы бесчестья помнят верховного лорда-командующего Эйдолона под многими титулами: Образцовый, Воскресший, Рассеченная Душа, Златый Молот… Ныне, впав в глубокую немилость примарха, он устремляется на Терру, где подходит к кульминации великая Ересь Хоруса.

    Однако прихоти коварного варпа и наущения таинственного создания, сведущего в истинах, которые кажутся невероятными даже многоопытному Эйдолону, приводят флотилию Детей Императора к планете Татрикала, где призраки прошлого таятся на каждом судьбоносном шагу. И сейчас Рассеченной Душе предстоит выбрать, как жить дальше… и какой частью себя ради этого пожертвовать.

    Лорд-командующий либо изгонит своих демонов, либо станет их безвольной марионеткой.
ashes-of-the-imperium: 'Вероломный магистр войны мертв. Терра лежит в руинах. Император безмолвствует. Среди развалин Дворца на свет тревожной зари выбираются ошеломленные выжившие. Прибыли новые силы — те, что пересекли всю Галактику, неся Империуму спасение. Их величают спасителями и столь же рьяно клеймят узурпаторами. В стане уцелевших войск Хорусовой Гранд-армады — сомнения и раздор. Они разгромлены и отчаянно стремятся избежать возмездия. Их боги тоже молчат. Посреди горя и смятения иные, исполненные надежды души верят, что война окончилась и эпоха возрождения уже близка. Но мудрые знают: такой войне не бывает конца. И сейчас важен лишь один вопрос: кто в нынешнюю грозную эпоху поднимется к власти, а кто падет.'
cthonia-s-reckoning: После долгих семи лет войны Ересь Хоруса приближается к своему концу. Но теперь, когда Магистр Войны Хорус идёт на Терру, чтобы лишить своего отца трона, источник силы самого архипредателя беззащитен. Хтония, мир, где когда-то господствовали жестокие банды убийц, занят преторианцами Императора — несокрушимыми Имперскими Кулаками. Для Сынов Хоруса это оскорбление требует расплаты. От вершин Врат Предателя, крепости VII легиона, и до бесконечных лабиринтов в планетной коре противники истребляют друг друга. Это война без пощады, и лишь самый безжалостный будет править Хтонией.
dropsite-massacre: |-
    Хорус восстал против Императора, очистив свой легион и легионы братьев от тех, кто не перешел на его сторону. Убийство должно было оставаться тайным, но правда открылась. Во имя Императора Рогал Дорн и Малкадор Сигиллит отправляют величайшее за всю историю войско во главе с примархами, чтобы покончить с мятежом до того, как он начнется по-настоящему.

    Однако лоялисты, намеренные принести возмездие, не знают глубины предательства, с которым им суждено столкнуться. Они не будут вершить резню — они станут ее жертвами. Последняя надежда вернуться к Великому крестовому походу и к единству Империума умрет в пыли Исствана V, а тех, кто выживет, ждет новая эра тьмы.
lupercal-s-war: "Никогда ещё Империум не знал такого смертоносного оружия, как объединенная мощь легионов Космического Десанта. Вместе эти могучие воины образуют несокрушимое копьё на переднем крае Великого Крестового Похода. Они стремятся вернуть человечеству его неотъемлемое право — господство над звёздами. Во главе каждого Легиона стоит легендарный примарх, и величайший среди них — Хорус Луперкаль, Воитель Империума. И всё же на пике своего могущества любимый сын предал свои клятвы, забрав с собой половину своих братьев и ввергнув их в вечное проклятие. \nОбреченная на вечную войну, Галактика пылает, пока верные легионы космодесантников и их сородичи-предатели разрушают всё, что они построили ценой собственной крови. В этой антологии собрано более 20 рассказов разных авторов, посвященных всем легионам Космического Десанта, начиная с Войн Объединения и заканчивая самыми жестокими днями Эпохи Тьмы."
visions-of-heresy: Из пепла Великого крестового похода выросло предательство. Хорус, всегда бывший первым среди сверхлюдей-примархов и недавно назначенный магистром войны, обратился против Императора и заключил союз с темными силами Хаоса. Имея под началом половину всех армий растущего Империума, он положил глаз на трон Священной Терры и развязал конфликт, который навсегда разделит Галактику. Образы войны, картины тьмы, измены и смерти — все это и многое другое представлено здесь, в книге, посвященной Ереси. На ее страницах собраны хрестоматийные изображения легионов Космодесанта и героев, что командовали ими, в том числе работы знаменитого художника Нила Робертса. К иллюстрациям прилагаются исторические справки по вселенной Warhammer 40,000, которые составил Алан Меррет и обновил Гай Хейли. В этом исправленном и дополненном издании, идеальном сопроводительном материале к «Ереси Хоруса» (серии-бестселлеру по версии New York Times) вы найдете исчерпывающие сведения о борьбе Луперкаля с Императором. Здесь с невиданными прежде подробностями излагается сюжет саги — вплоть до Осады Терры, определившей облик целой эпохи. Узрите конец старой эры и начало чего-то гораздо более мрачного, ведь «Ересь Хоруса» продолжает развиваться...
promethean-sun: Когда Великий Крестовый поход проносится по Галактике, силы Империума сталкиваются с миром, захваченным в рабство инопланетными эльдарами. Железные Руки Ферруса Мануса и Гвардия Смерти Мортариона сражаются против ксеносов-захватчиков, но именно Саламандры отваживаются пойти в самые глубокие и смертоносные джунгли, встречая на своем пути чудовищных рептилий и грязное колдовство. В конечном счёте, если легионы хотят освободить этот мир и принести просвещение его обитателям, то именно их примарх Вулкан должен помешать зловещим планам Эльдар.
aurelian: После уничтожения Монархии и Императорского порицания Легиона Несущих Слово примарх Лоргар провел много долгих лет в поисках универсальных истин космоса, когда он, наконец, заглянул глубоко в Око Ужаса, с мрачной неизбежностью обнаружив, что Око смотрит в ответ. Теперь, под руководством демона Ингефеля он предпринимает священное путешествие в самое сердце Хаоса и видит, что вся судьба человечества и Империума может основываться лишь на нескольких ключевых событиях. Пока Великий Крестовый поход сгорает в предательстве и обмане, Лоргар взвешивает цену своих амбиций и устанавливает курс на вечное проклятие.
brotherhood-of-the-storm: По мере того как предательские слова Хоруса распространяются на большую часть Легионов Астартес, Терра ищет оставшихся лояльных Космических Десантников, для защиты Империума. Любопытно однако, что одна группа сохраняет молчание, несмотря на явные попытки обеих сторон связаться с благородным пятым Легионом, грозными Белыми Шрамами Джагатай-хана. В системе Чондакс, занимаемой орками, после победы на Уланоре, разразилась жестокая война, и только теперь сыновья Чогориса устремляют свой взгляд к небесам...
the-reflection-crack-d: Большинство Детей Императора присягнули Хорусу, но их собственный путь ведёт прямиком к Богу Хаоса Слаанешу. В то время как воины Легиона погрязли в разврате, ближайшие союзники Фулгрима замечают, что их Примарх изменился, и подготовили заговор, чтобы очистить Финикийца от демонического влияния, которое влияли на его решения.
feat-of-iron: Под напором Великого Крестового похода Феррус Манус ведёт свой легион Железные Руки, сражаясь вместе с Саламандрами против смертоносных защитников в чужом захваченном мире. Но, будучи отрезанным от своих братьев и сыновей и потерянный во мраке, сможет ли Феррус Манус управлять своей агрессии достаточно долго, чтобы прислушаться к предупреждению, которое способно изменить его тёмную судьбу?
the-lion: С походом против Повелителей Ночи, который достиг своего апогея, Темные Ангелы начинают новую битву. Преданность Льву Эль'Джонсону будет проверенна и секрет будет раскрыт, что может изменить как лицо войны, так и судьбу легиона Темных Ангелов.
the-serpent-beneath: Когда всё ваше существование основывается на обмане, кому вы можете доверять? Это вопрос мучает Омегона, одного из близнецов Примархов Альфа Легиона, когда он готовит команду элитных оперативников для самой трудной и опасной миссии для любого легионера.Они должны проникнуть на секретную базу, контролируемую Альфа Легионом.
corax-soulforge: Несмотря на разрушение планов Коракса восстановить свой легион после Резни в зоне высадки, выжившие Гвардейцы Ворона остаются несломленными. Обнаружив повреждённый корабль Несущих Слово далеко за линией фронта, они находят свидетельство нового альянса между предателями и миром-кузницей Констаникса-II, а также узнают о новых ужасающих машинах войны, шагающих по полям боя всего сектора. Это угроза слишком велика, чтобы её игнорировать. Примарх Коракс должен проникнуть в сердце жрецов Механикум на Констаниксе, если хочет обрести союзников для грядущей войны, хотя ему, вероятно, придется столкнуться с правдой о собственной загадочной природе…
scorched-earth: 'Почти четверть миллиона преданных Космических Десантников погибли на Исстване V. Резня на месте высадки продолжалась всего несколько часов, и всё же Железные Руки, Гвардия Ворона и Саламандры были убиты теми, кого они когда-то называли братьями. С исчезновением примарха, тяжким грузом лежащим на сердцах, Ра’стан и Усабиус из XVIII Легиона оставили выживших собратьев и направились к Ургальской впадине. Их миссия: найти то, что осталось от могучего Вулкана...'
tallarn-executioner: |-
    Во времена Великого крестового похода цветущий мир Талларн служил перевалочной базой для войск и боевых машин Имперской Армии. Теперь он разрушен смертоносными вирусными бомбами Железных Воинов и обращен в ядовитую пустыню. Выжившим приходится сражаться за то немногое, что осталось от их родины. Уцелевшие из некогда могучего 701-го танкового полка выходят из подземных убежищ, и битва за Талларн начинается…
    Однако тайные силы стремятся управлять событиями — с обеих противоборствующих сторон.
prince-of-crows: Крестовый поход Тарамас подходит к неизбежному завершению. Ночной Охотник находится в коме после разборок со своим братом Лионом Эль' Джонсоном, и в его отсутствие на Севатара падает ответственность командовать легионом. Но у самопровозглашённого Принца Воронов есть свои собственные планы спасти Повелителей Ночи от уничтожения.
the-crimson-fist: Оказавшись в захолустной системе Фалл, вспомогательный флот Имперских Кулаков, первоначально направлявшийся на Истваан III, пережидал варп-штормы, которые подстерегли их много месяцев назад. Под командованием капитана Алексиса Полукса, казалось бы, забытые остальным Империумом, они надеются завершить свою миссию и отчитаться перед своим примархом Рогалом Дорном, чтобы вернуться в разросшийся конфликт. Но судьба вновь бросает вызов, когда старые соперничества разгораются вновь, и коварные Железные Воины ждут своего часа, чтобы нанести удар. Вражда между Дорном и его своенравным братом Пертурабо теперь обещает перерасти в открытую войну.
the-purge: Теневой крестовый поход распространяется по Ультрамару, и 34-я Рота Несущих Слово обрушивается на изолированную планету Персептон Прим. По мере того, как боевые действия превращаются в запрограммированное уничтожение, озлобленный капитан Сор Талгрон начинает сомневаться тем, какую роль в происходящем отвёл ему Лоргар — ведь для того, кто стоял ядом с примархами и верховными лордами в великих залах Имперского Дворца, какая честь карать жалких сынов Гиллимана? Но цена сомнения известна слишком хорошо, и прежде чем Несущим Слово предстоит вернуться на Терру с триумфом, они должны будут очистить последние остатки такого неверия с лица галактики...
ravenlord: По мере того, как Ересь Хоруса продолжается, Кораксу и его остатки некогда великого легиона ведут совершенно другие войны — освобождают планеты, угнетаемые предателями, они собирают все больше и больше последователей под своё знамя, разрушая влияние Воителя везде, где они могут. Но после неожиданной встречи с выжившим после резни на Исстване V, Гвардия Воронов узнаёт о тюремной колонии Карандиру, и вскоре понимают, что им придётся встретиться с призраками своего собственного прошлого с родной планеты Освобождение, если они хотят победить.
the-seventh-serpent: После почти полного уничтожения Железных Рук, Гвардии Ворона и Саламандр на Исстване V, разбросанные отряды этих «разбитых легионов» ведут партизанскую войну против войск Хоруса по всей галактике. Экипаж «Сизефея» собирается напасть на скрытый аванпост Альфа-Легиона, а нападение организует не кто иной, как сам печально известный военачальник Шадрак Медузон. На что действительно рассчитывал Мудузон нападая на сыновей Альфария, которые возможно являются лучшими мастерами обмана...
tallarn-ironclad: 'Битва за Талларн между изменниками Железными Воинами и Имперской Армией в самом разгаре. Поверхность токсичного мира словно ковер покрывает бронетехника! Дредноуты против танков, танки против титанов… В крупнейшем в истории Галактики бронетанковом столкновении участвует миллион машин войны! Никто не может покинуть безопасность тесных и неудобных кабин из страха превратиться в ядовитую слизь. Хотя роман динамичен и полон действия, читателя намного больше занимает вопрос: какая же тайна заставляет Железных Воинов вести войну?'
cybernetica: Вскоре после того, как до Терры дошла весть о готовящемся восстании Хоруса, пал Марс. Недовольные представители жречества Механикума, соблазнённые обещаниями магистра войны о независимости и процветании, повернулись против Империума и вынудили примарха Рогала Дорна отдать приказ о блокаде красной планеты. Теперь стало ясно, что разложение распространилась слишком глубоко, и что должны быть приняты решительные меры, чтобы главная планета-кузница осталась верной Императору. Взывая к опыту тех, кто своими глазами видел так называемую «Смерть Невинных», Лорд Дорн и Малкадор Сигиллит рассматривают своё окончательное решение — полное уничтожение всей жизни на Марсе.
wolf-king: После сожжения Просперо Космические Волки были атакованы силами Альфа-Легиона, которое загнали их в туманность Алакксес. В отчаянии Леман Русс призывает своих братьев-примархов. Но никто не пришёл. И теперь, когда флот зашёл в тупик, а припасы на исходе, воины своры наверняка погибнут среди ржаво-красных облаков туманности. Но какой это будет славный конец, достойный древних саг, и сыновья Альфария скоро узнают, что загнанный в угол волк всегда самый смертоносный.
the-honoured: После окончания нападения Несущих Слово на Калт, выжившие с обеих сторон переместились в подземные аркологические убежища, спасаясь от зловещего воздействия звезды Виридии. В то время пока примарх Робаут Жиллиман пытается решить, как победить в столь неожиданном событии, Ультрамарины вынуждены сражаться в новой подземной войне. Сможет ли Стелок Эфон, известный капитан «Славной 19-ой» роты возглавить их и повести к окончательной победе над предателями? Это возможно, если он сможет обуздать свое горькое желание отомстить…
the-unburdened: Долгое время считая себя преследуемыми остальной частью Империума, апостолы XVII легиона десятилетиями подстрекали к мятежу, предательство и даже открытую ересь. Но для Курты Седда из ордена Третьей руки, нападение Несущих Слово на Калт оказалось... волнующим. Затянутый в призрачные тени подземного мира планеты, капеллан и его набожные братья должны отбросить в сторону все сомнения и продолжить вести войну против Ультрамаринов, независимо от конечной цены.
garro-vow-of-faith: Натаниэль Гарро прошёл долгий путь. После того, как ему удалось избежать предательской резни на Исстване III, улетев на «Эйзенштене», Гарро получает новый смысл жизни, в качестве агента-прим Странствующих Рыцарей — и всё же, Гарро стал равнодушным, когда раскрылись все планы Малкадора Сигиллита на будущее, снова подвергая сомнению его место в галактике. И пока Воитель приближается к святой Терре, Гарро сам приземляется на её поверхность. Цель его поисков? Не кто иная, как живая Святая Эуфратия Киилер.
sons-of-the-forge: Возложенный самим примархом священный долг, Отец Кузни Т'келл Легиона Саламандр готовится к тому, что вполне может стать его последним путешествием. Вместе с несколькими избранными элитными бойцами Легиона — Огненными Драконами, он должен унести последние семь величайших орудий Вулкана в тайное хранилище, известное как Ковка, чтобы эти могущественные предметы не достались ни коварным врагам, ни благородным союзникам. Но слух об этих легендарных артефактах уже распространились и очень многие постараются помешать Т’келлу достичь своей цели. Но долг Саламандр оставаться верными, независимо от того, с какими ужасами им придется столкнуться...
dreadwing: Когда Гибельный шторм был усмирён и силы Жиллимана и Сангвиния поспешили на Терру, Тёмные Ангелы возглавили кровавую кампанию по уничтожению миров легионов предателей. Но по мере того, как Легион распадается на части и число разрушенных миров между ними и Террой растёт, лейтенантам Крыла приходится задаваться вопросом, продолжает ли Лев вести войну, которую он намерен выиграть — или уже проиграл.
spear-of-ultramar: Осада Терры приближается и судьба Галактики балансирует на лезвии бритвы. Робаут Гиллиман возглавляет огромный флот Ультрамаринов, который спешит к Тронному Миру, и он обладает такой силой, что может переломить ход войны в пользу лоялистов. Как бы ни был полон решимости Гиллиман добраться до Терры, Хорус столь же полон решимости задерживает своего брата, пока не станет слишком поздно. Путь Гиллимана сквозь Гибельный Шторм пролегает через систему Карчера, где кузнец войны Хроссус и его одинокая рота Железных Воинов намереваются стоять насмерть. Любой ценой они должны сдерживать Ультрамаринов. Гиллиман предвидит западню, но не может избежать её. Так начинается отчаянное сражение, где каждая секунда может означать разницу между выживанием или вымиранием для Империума.
