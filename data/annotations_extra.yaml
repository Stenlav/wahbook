# Тексты — как на странице издания, без правок.

gnev-luperkalya: "Ересь Хоруса — эпохальный конфликт, охватывающий сотни миров и тысячи сражений, — описывается в бессчётных рассказах о героизме и отваге, вероломстве и злодействе. В этом двухтомном собрании произведений, ранее не публиковавшихся на русском языке, перед вами предстанут лояльные и предательские легионы Космодесанта, а также другие участники междоусобной войны в Галактике. Неважно, кто вы — легионер-ветеран или новичок, впервые открывший для себя мрачный мир Ереси Хоруса. Любого читателя захватят повести и рассказы об изменниках, отступниках и лоялистах из числа астартес, техножрецов, имперских рыцарей, кустодиев, Сестёр Безмолвия и прочих участников разрушительных битв титанических масштабов, кои породила измена."
